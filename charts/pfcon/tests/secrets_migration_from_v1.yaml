suite: util.valueOrLookupOrRandom migration from v1 -> v2 name
templates:
  - secrets.yml
release:
  name: subsequent-run-test-pfcon
  namespace: suruntest
  revision: 2
  upgrade: true
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - kind: Secret
      apiVersion: v1
      metadata:
        name: subsequent-run-test-pfcon-pfcon # v1 name (deprecated)
        namespace: suruntest
      data:
        SECRET_KEY: 'aWFtYm9sZAo='
tests:
  - it: should use the previous value
    asserts:
      - equal:
          path: data.SECRET_KEY
          value: 'aWFtYm9sZAo='
