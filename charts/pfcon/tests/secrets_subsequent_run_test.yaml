suite: util.valueOrLookupOrRandom subsequent run
templates:
  - secrets.yml
release:
  name: subsequent-run-test
  namespace: suruntest
  revision: 2
  upgrade: true
kubernetesProvider:
  scheme:
    "v1/Secret":
      gvr:
        version: v1
        resource: secrets
      namespaced: true
  objects:
    - kind: Secret
      apiVersion: v1
      metadata:
        name: subsequent-run-test-pfcon
        namespace: suruntest
      data:
        SECRET_KEY: 'aWFtYm9sZAo='
tests:
  - it: should use the previous value
    asserts:
      - equal:
          path: data.SECRET_KEY
          value: 'aWFtYm9sZAo='
  - it: should use the given secret
    set:
      secretKey: namesjamesbond
    asserts:
      - equal:
          path: data.SECRET_KEY
          value: namesjamesbond
          decodeBase64: true
