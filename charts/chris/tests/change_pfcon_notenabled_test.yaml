suite: pfcon currently not enabled
templates:
  - storage.yml
release:
  name: lackspfcon
  namespace: changepfconnotenabled
  revision: 2
  upgrade: true
kubernetesProvider:
  scheme:
    "v1/PersistentVolumeClaim":
      gvr:
        version: v1
        resource: persistentvolumeclaims
      namespaced: true
  objects:
    - kind: PersistentVolumeClaim
      apiVersion: v1
      metadata:
        name: lackspfcon-chris
        namespace: changepfconnotenabled
tests:
  - it: should not allow pfcon to be enabled
    set:
      pfcon.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Cannot set pfcon.enabled=true and/or pfcon.config.innetwork=true now because CUBE is using its own PersistentVolumeClaim for storage.
  - it: should not allow pfcon to be changed to innetwork mode.
    set:
      pfcon.config.innetwork: true
    asserts:
      - failedTemplate:
          errorMessage: Cannot set pfcon.enabled=true and/or pfcon.config.innetwork=true now because CUBE is using its own PersistentVolumeClaim for storage.
