nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

global:
  # -- Global default StorageClass for Persistent Volume(s)
  defaultStorageClass: ""

  # -- Optional security context to apply to all pods
  # podSecurityContext:
  #   runAsUser: 123456
  #   runAsGroup: 789

  # -- Image pull secrets.
  # -- Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
    # - name: my-dockerhub-login

# -- Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- OpenShift route
route:
  enabled: false
  host: chart-example.local
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    destinationCACertificate: ''

# -- ChRIS backend (CUBE) configuration.
cube:
  image:
    repository: ghcr.io/fnndsc/cube
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # -- Use inter-pod affinity as a workaround for using a ReadWriteOnce PersistentVolumeClaim
  enablePodAffinityWorkaround: false

  # -- Prefix to use for job names submitted to Kubernetes. Must be a unique when the
  # -- Kubernetes namespace is used for more than one instance of CUBE.
  # -- The default behavior is to use the release name as the job prefix.
  jobPrefix:

  # -- CUBE configuration. Note: all values must be string.
  config:
    # -- Event polling frequency. Smaller value increases responsiveness at the cost of increased resource
    # -- usage and possible concurrency bugs.
    CUBE_CELERY_POLL_INTERVAL: "5.0"
    # -- Allowed hosts. Note: "*" is okay and convenient when OpenShift router or
    # -- k8s ingress is validating the HTTP Host header.
    DJANGO_ALLOWED_HOSTS: "*"
    DJANGO_CORS_ALLOW_ALL_ORIGINS: "true"
    DJANGO_CORS_ALLOWED_ORIGINS: ""
    DJANGO_SECURE_PROXY_SSL_HEADER: ""
    DJANGO_USE_X_FORWARDED_HOST: "false"

    ## LDAP configuration
    # -- Enable LDAP authentication
    AUTH_LDAP: "false"
    # AUTH_LDAP_SERVER_URI: "ldap://192.168.0.29:389"
    # AUTH_LDAP_BIND_DN: "cn=admin,dc=fnndsc,dc=org"
    # AUTH_LDAP_USER_SEARCH_ROOT: "dc=fnndsc,dc=org"
    # AUTH_LDAP_GROUP_SEARCH_ROOT:
    # AUTH_LDAP_CHRIS_ADMIN_GROUP:

    # -- Disable user account creation via API.
    # -- If `true`, user accounts can only be created manually or
    # -- via SSO (LDAP, ...)
    # -- A value of `false` would allow anyone to create an account.
    DISABLE_USER_ACCOUNT_CREATION: "true"

    # -- Use a database connection pool.
    # -- This setting _might_ improve performance, but is problematic: one connection
    # -- pool is used per celery worker, which can max out the number of connections
    # -- allowed by Postgres (default 100). Furthermore, there might be a bug in CUBE
    # -- where disconnections are not reconnected.
    DATABASE_CONN_POOL: "false"

    # DATABASE_CONN_POOL_MIN_SIZE: 4
    # DATABASE_CONN_POOL_MAX_SIZE: 8
    # DATABASE_CONN_POOL_TIMEOUT: 10

    # -- URL of default peer ChRIS from where to get plugins.
    CHRIS_STORE_URL: 'https://cube.chrisproject.org/api/v1/'

  # -- Additional secret environment variables for CUBE.
  secrets:
    # -- password of the superuser+admin "chris" user account.
    # -- If unset, the previously set value will be used, or a random value will be generated.
    CHRIS_SUPERUSER_PASSWORD: ""

    # -- LDAP bind password.
    # AUTH_LDAP_BIND_PASSWORD: "admin1234"

    # -- Django secret key. Ref: https://docs.djangoproject.com/en/5.1/ref/settings/#secret-key
    # -- Note: if unset, its previous value will be looked up, or a random
    #          value will be generated for you.
    # SECRET_KEY: supersecretkey

    # -- Celery broker URI.
    # -- Required if `dragonfly.enabled=false`.
    # CELERY_BROKER_URL: "amqp://guest:password@localhost:5672"

    # -- Configuration of the PostgreSQL database.
    # -- Required if `.crunchyPgo.enabled=false`.
    # DATABASE_HOST: "postgres.svc"
    # DATABASE_PORT: "5432"
    # POSTGRES_DB: "chris"
    # POSTGRES_USER: "chris"
    # POSTGRES_PASSWORD: "elephant"

  # -- Environment variables for _ChRIS_ backend containers.
  env: {}
    # - name: POSTGRES_PASSWORD
    #   valueFrom:
    #     secretKeyRef:
    #       name: postgres-db
    #       key: password
  # -- Additional envFrom entries to include other ConfigMap/Secret objects.
  envFrom: {}

  # -- CUBE files storage.
  # -- NOTE: The default configuration (which is recommended for most cases)
  # --       is to share one PersistentVolumeClaim between pfcon and CUBE.
  # --       In this situation, configure `pfcon.storage` and ignore this
  # --       section.
  storage:
    enabled: false
    size: 8Gi
    accessModes: [ "ReadWriteMany" ]
    # storageClass: ""

  # -- Celery beat scheduler configuration.
  celeryBeat:
    # -- Command to run for the celery beat scheduler.
    command: ["celery", "-A", "core", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    # -- Resources for celery beat. Defaults are good enough.
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 100m

  # -- Main celery worker configuration.
  workerMains:
    # -- Command to run for the main worker.
    command: ["celery", "-A", "core", "worker", "-c", "4", "-l", "info", "-Q", "main1,main2"]
    # -- Resources for the main worker.
    # -- If an out-of-network pfcon is configured, recommended memory limit is twice
    # -- the largest anticipated plugin instance output directory's total size.
    # -- This is because of inefficient implementation, see https://github.com/FNNDSC/ChRIS_ultron_backEnd/issues/377
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 500m

  # -- Periodic celery worker configuration.
  workerPeriodic:
    # -- Command to run for the periodic worker.
    command: ['celery', '-A', 'core', 'worker', '-c', '2', '-l', 'info', '-Q', 'periodic']
    # -- Resources for the periodic worker. Defaults are good enough.
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 250m

  # -- CUBE ASGI server configuration.
  server:
    # -- CUBE server pod annotations.
    podAnnotations: {}
    # -- Deployment replicas count.
    replicas: 1
    # -- Service configuration.
    service:
      type: ClusterIP
      port: 8000
      # -- CUBE server service nodePort
      nodePort:

    # -- CUBE server command.
    command: ["python3", "-m", "uvicorn", "--host", "0.0.0.0", "--port", "8000", "config.asgi:application"]
    # -- Resources for the HTTP server (ASGI).
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 500m

    # -- CUBE server container hostPort.
    hostPort:

    # -- CUBE server container livenessProbe.
    livenessProbe:
      # -- Enable the livenessProbe.
      enabled: true
      httpGet:
        path: /api/v1/users/
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5

  podSecurityContext: {}

# -- ServiceAccount of chris-related pods.
serviceAccount:
  annotations: {}

# -- ChRIS database migrations.
migrate:
  # -- Automatically apply database migrations using a Kubernetes job.
  enabled: true
  # -- Kubernetes job configuration
  job:
    labels:
      kubernetes.io/description: "ChRIS backend database migration"
    command: [python, manage.py, migrate, --noinput]
    resources:
      requests:
        cpu: 1
        memory: 4Gi
      limits:
        cpu: 1
        memory: 4Gi
    # -- If set, automatically delete the Job a period of time after it finishes.
    ttlSecondsAfterFinished: 604800 # 1 week
    # -- Specifies the number of retries before marking this job failed.
    backoffLimit: 1
  # -- Configuration of resources which monitor for the completion of database migration.
  observer:
    role:
      annotations:
        kubernetes.io/description: "Role which may watch for the completion of ChRIS backend database migrations"
    roleBinding:
      annotations:
        kubernetes.io/description: "RoleBinding for allowing account to watch for the completion of ChRIS backend database migrations"

# -- [EXPERIMENTAL] Automatic provisioning using chrisomatic.
# -- https://github.com/FNNDSC/chrisomatic#readme
chrisomatic:
  enabled: true
  job:
    image: ghcr.io/fnndsc/chrisomatic:1.0.0
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 250m
        memory: 1Gi
    # -- If set, automatically delete the Job a period of time after it finishes.
    ttlSecondsAfterFinished: 604800 # 1 week
    # -- Specifies the number of retries before marking this job failed.
    backoffLimit: 1
  # -- Configuration of how the pfcon from the subchart is registered.
  subchartPfconConfig:
    name: "innetwork"
    description: "Kubernetes cluster compute resource"
  # -- chrisomatic.yml configuration file.
  config:
    # -- Do *not* configure a value for the "on" key in chrisomatic.yml.
    # -- This section is configured automatically by the chart template.
    'on': {}
    cube:
      # -- Configuration of pfcon services to register as compute resources
      # -- of this CUBE.
      # -- If pfcon.enabled=true, it will be prepended to this list automatically
      # -- by the chart template. You can configure its name and description above
      # -- in `chrisomatic.subchartPfconConfig`.
      compute_resource: []
      # -- Plugins to register to this ChRIS backend.
      # -- ref: https://github.com/FNNDSC/chrisomatic/blob/master/docs/schema.adoc#cubeplugins
      plugins:
        - name: pl-dircopy
        - name: pl-tsdircopy
        - name: pl-topologicalcopy

# -- Configuration of pre-defined initContainers.
predefinedInitContainers:
  # -- Configuration of the pg_isready initContainer, which polls for the PostgreSQL
  # -- database to be ready before starting dependent services.
  wait-db:
    image: "docker.io/alpine/psql:18.3@sha256:16de1cf6b3f04e78c85707355d98e7003978fe90c2502a174ed224992848a8f1"
    command:
      - /bin/sh
      - -c
      - until pg_isready -U "$USERNAME" -h "$HOST" -p "$PORT" -d "$DBNAME"; do sleep 1; done
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
  wait-migrate:
    image: "docker.io/alpine/kubectl:1.35.3@sha256:ebf9d81d06441b3183fdc6e2dbc9f5d0db4d0464808b5bcd3c9021f54f6e65db"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi

# -- Crunchy Postgres Operator (PGO) PostgresCluster configuration.
# -- NOTE: PGO must be installed on the cluster. It tends to be available
#          in OpenShift environments.
# -- Ref: https://access.crunchydata.com/documentation/postgres-operator/5.3/references/crd/6.0.x/postgrescluster-v1
crunchyPgo:
  # -- Create a PostgresCluster using PGO.
  enabled: false
  spec:
    postgresVersion: 18
    users:
      - name: chris
        databases: [ chris ]
    # -- Specifies one or more sets of PostgreSQL pods that replicate data for this cluster.
    # -- Ref: https://access.crunchydata.com/documentation/postgres-operator/5.3/references/crd/6.0.x/postgrescluster-v1#postgresclusterspecinstancesindex
    instances:
      - name: instance1
        replicas: 1
        resources:
          requests:
            cpu: 1
            memory: 4Gi
          limits:
            cpu: 1
            memory: 4Gi
        dataVolumeClaimSpec:
          accessModes: [ ReadWriteOncePod ]
          resources:
            requests:
              storage: 8Gi
          # storageClassName: ""

    # -- PostgreSQL backup configuration.
    # -- Ref: https://access.crunchydata.com/documentation/postgres-operator/5.3/references/crd/6.0.x/postgrescluster-v1#postgresclusterspecbackups
    backups: {}

# -- [SUBCHART] DragonflyDB, a replacement for Redis.
# -- May be used as Celery's broker.
# -- Ref: https://github.com/dragonflydb/dragonfly/tree/main/contrib/charts/dragonfly#values
dragonfly:
  # -- Enable DragonflyDB and configure it as Celery's broker.
  enabled: false
  # -- Database number for ChRIS to use.
  databasePath: "/0"
  resources:
    # -- The requested resources for the containers
    requests:
      cpu: 250m
      memory: 2Gi
    # -- The resource limits for the containers
    limits:
      cpu: 250m
      memory: 2Gi
  storage:
    # -- If /data should persist. This will provision a StatefulSet instead.
    enabled: false
    # -- Volume size to request for the PVC
    requests:
    # -- Global StorageClass for Persistent Volume(s)
    storageClassName: ""

# -- Configuration of pfcon, the ChRIS compute controller
pfcon:
  enabled: true

  replicaCount: 1
  podAnnotations: {}
  podSecurityContext: {}

  service:
    type: ClusterIP
    port: 5005

  nodeSelector: {}

  # -- Storage space for CUBE files should be configured here.
  # -- It is recommended to allocate as much space as possible for CUBE files.
  storage:
    existingClaim: ""
    size: 8Gi
    # -- NOTE: use ReadWriteMany if possible. Otherwise, you may need to
    # -- set `cube.enablePodAffinityWorkaround=true`
    accessModes: [ "ReadWriteMany" ]
    storageClass:

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # -- pfcon configuration
  # -- Recommended to keep as-is
  config:
    innetwork: true
    storageEnv: fslink

  # -- Extra environment variables.
  extraEnv:
    GUNICORN_CMD_ARGS: "--workers=4 --timeout=300"
    JOB_LABELS: chrisproject.org/job=plugininstance
    ENABLE_HOME_WORKAROUND: "yes"
    REMOVE_JOBS: "yes"
    IGNORE_LIMITS: "no"

    # -- Set securityContext of containers created by pman to have the same securityContext as .global.podSecurityContext
    # -- or the default fnndsc/cube container user, so that the container user can write to the shared volume's filesystem.
    # -- Default behavior is to detect whether on OpenShift: if so, set as false, true otherwise.
    setSecurityContext:

# -- Configuration of PFDCM, the ChRIS PACS bridge
pfdcm:
  # -- Enable PFDCM, the ChRIS PACS bridge
  enabled: false

  # -- String to partially override the names template
  nameOverride: ""
  # -- String to fully override the names template
  fullnameOverride: ""

  # -- Image for PFDCM
  image:
    repository: ghcr.io/fnndsc/pfdcm
    pullPolicy: IfNotPresent
    tag: "3.1.22"

  imagePullSecrets: []

  # -- DICOM application entity title
  aet: "ChRIS"

  # -- Additional PFDCM configuration. Usually, you don't need to change this.
  additionalConfig:
    # -- Deprecated configuration of ChRIS backends.
    cube: {}
      # local:
      #   url: https://cube.example.org/api/v1/
      #   username: pfdcm
      #   password: pfdcm1234
    # -- Deprecated configuration of storage.
    storage: {}
      # local:
      #   storagetype: fs
      #   storepath: /files
    # -- Configuration of PACS.
    pacs:
      # -- Configuration of PACS services PFDCM can talk with.
      # -- If the Orthanc subchart below is enabled, the correct values for
      # -- it will be automatically filled in. If PFDCM need to speak with
      # -- other PACS outside of this chart, add them here.
      services: {}
        # orthanc:
        #   info:
        #     aet: CHRISLOCAL
        #     aet_listener: ORTHANC
        #     aec: ORTHANC
        #     serverIP: orthanc
        #     serverPort: 4242

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Extra environment variables for the PFDCM container.
  # -- Note: PORT is configured automatically, it is not recommended to set it manually.
  extraEnv:
    # -- Maximum number of web server workers. Strongly encouraged to increase this value.
    MAX_WORKERS: 2

  # -- Resources configuration for pfdcm. Strongly encouraged to increase these values.
  resources:
    limits:
      cpu: 250m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  hostPort:

  readinessProbe: {}

  livenessProbe: {}
    # httpGet:
    #   path: /api/v1/about/
    #   port: http
    # initialDelaySeconds: 10
    # periodSeconds: 10
    # timeoutSeconds: 5
    # failureThreshold: 3

  startupProbe: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

  # -- Labels for the Deployment/Service resource.
  labels: {}

  # -- Annotations for the Deployment/Service resource.
  annotations: {}

  # Kind configuration
  #####################
  # -- kind must be one of:
  # --
  # -- - "Deployment": use (standard) Kubernetes Deployment and Service APIs
  # -- - "Service": use the KNative Serving API
  kind: Deployment

  # KNative Serving configuration
  #####################
  # -- KNative Serving revision annotations.
  # -- Only used with `pfdcm.kind=Service`
  revisionAnnotations: {}
    # autoscaling.knative.dev/target: "100"
    # autoscaling.knative.dev/min-scale: "1"
    # autoscaling.knative.dev/max-scale: "3"
    # autoscaling.knative.dev/scale-to-zero-pod-retention-period: "1m5s"

  # Deployment configuration
  #####################

  # -- This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  # -- Ignored if `autoscaling.enabled=true`
  # -- Only used with `pfdcm.kind=Deployment`
  replicaCount: 1

  # -- This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  # -- Only used with `pfdcm.kind=Deployment`
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    port: 4005
    # nodePort:
    annotations:
      kubernetes.io/description: PFDCM API. Swagger docs available on /docs

  # -- This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
  # -- Only used with `pfdcm.kind=Deployment`
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # -- OpenShift route.
  # -- Only used with `pfdcm.kind=Deployment`
  route:
    enabled: false
    host: chart-example.local
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
      destinationCACertificate: ''

  # -- Helm test configuration
  test:
    # -- Path to test for connectivity
    path: '/api/v1/hello/'

  # -- This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  # -- Only used with `pfdcm.kind=Deployment`
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- DICOM listener for pfdcm. Enabled when pfdcm is enabled.
  listener:
    image:
      repository: ghcr.io/fnndsc/oxidicom
      pullPolicy: Always
      tag: "3.1.0"
    podAnnotations: {}
    # -- (optional) hostPort for DICOM listener
    hostPort:
    # -- The PACS server must be configured to push to this service.
    # -- If using Orthanc, the Helm chart will help you validate your
    # -- configuration of Orthanc's modailities to include this service.
    service:
      enabled: true
      type: ClusterIP
      port: 11111
      # nodePort: 30033
    replicas: 1
    ## manual configuration of OpenTelemetry
    # env:
    #   - name: OTEL_RESOURCE_ATTRIBUTES
    #     value: service.name=oxidicom
    #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
    #     value: http://tempo:4317

    # -- Optional configurations of oxidicom.
    config:
      # -- number of DICOM listener threads
      # -- ref: https://chrisproject.org/docs/oxidicom/deployment#performance-tuning
      listenerThreads: 8

      # -- number of Tokio runtime threads
      # -- ref: https://chrisproject.org/docs/oxidicom/deployment#performance-tuning
      tokioThreads: 4

      # -- enable/disable logging and set verbosity of components
      logging: oxidicom=warn

      ## strictPduLength, uncompressedOnly, and maxPduLength are strange DICOM
      ## options which you probably want to leave as their default values.
      # strictPduLength: true
      # uncompressedOnly: true
      # maxPduLength: 16384
      ## Whether to accept unknown DICOM transfer syntaxes.
      # promiscuous: true

    resources:
      # It's written in Rust!
      # Memory usage typically stays under 20MiB, unless there is backpressure
      # from slow disk write speed
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 256Mi

# -- Orthanc open-source PACS server subchart.
# -- Ref: `helm show values fnndsc/orthanc --version 2.0.0`
orthanc:
  # -- Enable Orthanc. If true, it is recommended to also set pfdcm.enabled=true.
  enabled: false

  # -- This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1

  # -- This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # -- Image repository.
    # -- Note: jodogne/orthanc-plugins is preferred over orthancteam/orthanc
    # --       because the compressed image size is smaller (80MB v.s. 1.1GB)
    repository: docker.io/jodogne/orthanc-plugins
    # -- This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # -- PersistentVolumeClaim storage configuration
  persistence:
    index:
      # -- Enable Orthanc SQLite index data persistence using PVC
      enabled: false
      # -- Name of an existing PVC to use
      existingClaim:
      # -- PVC Storage Class for Orthanc SQLite index
      storageClass:
      # -- PVC Access Mode for Orthanc SQLite index
      accessModes: [ ReadWriteOncePod ]
      # -- PVC Storage Request for Orthanc SQLite index
      size: 1Gi
      # -- Annotations for the PVC
      annotations: {}
      # -- Labels for the PVC
      labels: {}
    storage:
      # -- Enable Orthanc storage data persistence using PVC
      enabled: false
      # -- Name of an existing PVC to use
      existingClaim:
      # -- PVC Storage Class for Orthanc storage
      storageClass:
      # -- PVC Access Mode for Orthanc storage
      accessModes: [ ReadWriteOnce ]
      # -- PVC Storage Request for Orthanc storage
      size: 1Gi
      # -- Annotations for the PVC
      annotations: {}
      # -- Labels for the PVC
      labels: {}

  # -- Orthanc configuration
  # -- Ref: https://orthanc.uclouvain.be/book/users/configuration.html
  # -- Do not put secrets in here. Use the environment variable configuration
  # -- syntax and declare values for extraEnv or extraEnvFrom.
  config:
    # -- The logical name of this instance of Orthanc. This one is
    # -- displayed in Orthanc Explorer and at the URI "/system".
    Name: ChRIS Orthanc

    # Network Topology
    # ----------------
    # -- The list of the known DICOM modalities. This option is ignored if
    # -- "DicomModalitiesInDatabase" is set to "true", in which case you
    # -- must use the REST API to define modalities.
    # -- IMPORTANT: if orthanc.enabled=true and pfdcm.enabled=true, you must
    # --            configure Orthanc to be able to push to the oxidicom
    # --            service of ChRIS.
    DicomModalities: {}
      # "ChRIS": [ "ChRIS", "NAME-oxidicom", 11111 ]

